upstream ess_backend {
    server ess-backend:3001;
}

upstream ess_minio {
    server minio:9010;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # allow large multipart uploads (tus/multer); tune to your max file size
    client_max_body_size 100m;

    # SPA: serve built assets, fall back to index.html for client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → express
    location /api/ {
        proxy_pass http://ess_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO → express (needs WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://ess_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # uploaded files served by express.static('public') on backend
    location /uploads/ {
        proxy_pass http://ess_backend;
        proxy_set_header Host $host;
    }

    # MinIO object storage: /ess/<key> = bucket "ess" on the minio container.
    # MINIO_PUBLIC_URL=https://ess.miraki.in makes stored URLs route through here.
    location /ess/ {
        proxy_pass http://ess_minio;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
