# HOST nginx config (runs on the host, NOT in a container).
# Terminates TLS for ess.miraki.in, forwards everything to the
# ess-frontend container (published on 127.0.0.1:8080). The frontend
# nginx does the /api, /socket.io, /uploads split internally.
#
# Install: copy to /etc/nginx/sites-available/ess.miraki.in (or conf.d/),
# symlink/enable, `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name ess.miraki.in;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ess.miraki.in;

    ssl_certificate     /etc/letsencrypt/live/ess.miraki.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ess.miraki.in/privkey.pem;

    client_max_body_size 100m;   # match frontend container limit

    # everything → ess-frontend container; it routes api/socket.io/uploads/SPA
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket (socket.io)
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# Put this in the http{} block (e.g. /etc/nginx/nginx.conf), NOT here:
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
