# TEMP host nginx — plain HTTP, no domain/TLS yet.
# Serves the ess app on port 8000 by proxying to the ess-frontend container (127.0.0.1:8090).
# Install on host: copy to /etc/nginx/conf.d/ess-temp.conf
#   nginx -t && systemctl reload nginx   (or: docker exec <nginx> nginx -s reload)
# Later: replace with default.conf (domain + TLS), remove this.
#
# Needs this in nginx.conf http{} (once, global) for WebSocket:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8000;
    server_name _;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
