services:
  minio:
    build:
      context: ./minio                 # creds + ports baked into deploy/minio/Dockerfile
      dockerfile: Dockerfile
    container_name: minio              # hostname must match S3_ENDPOINT=http://minio:9010
    restart: always
    ports:
      - "127.0.0.1:9010:9010"          # S3 API (local dev convenience)
      - "127.0.0.1:9011:9011"          # web console
    volumes:
      - ess-minio-data:/data
    networks:
      - ess-net

  ess-backend:
    build:
      context: ../backend             # backend/ is the build context (Dockerfile does `COPY . .`)
      dockerfile: Dockerfile
    container_name: ess-backend
    restart: always
    env_file:
      - ../.env.production             # keep secret at repo root (gitignored)
    volumes:
      - ess-uploads:/app/public/uploads
    networks:
      - ess-net      # talk to ess-frontend

  ess-frontend:
    build:
      context: ../frontend           # frontend/ is the build context
      dockerfile: Dockerfile
    container_name: ess-frontend
    restart: always
    depends_on:
      - ess-backend
    ports:
      # exposed on all interfaces for now → http://<server-ip>:8090
      # later: bind to 127.0.0.1 and put host nginx (TLS + domain) in front
      - "127.0.0.1:8090:80"
    networks:
      - ess-net

volumes:
  ess-uploads:
  ess-minio-data:

networks:
  ess-net:
    driver: bridge
